<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📅채용달력📅</title>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, set, remove }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCi96DZbnjoUN0CZKFPPzzVMlqyQ33Hx9E",
      authDomain: "job-calendar-93c93.firebaseapp.com",
      databaseURL: "https://job-calendar-93c93-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "job-calendar-93c93",
      storageBucket: "job-calendar-93c93.firebasestorage.app",
      messagingSenderId: "256800524240",
      appId: "1:256800524240:web:20ab1d5a7909ca5797dbd5"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getDatabase(app);
    const jobsRef = ref(db, 'jobs');

    onValue(jobsRef, (snapshot) => {
      const data = snapshot.val();
      window.jobs = data ? Object.entries(data).map(([id, v]) => ({ id, ...v })) : [];
      setStatus('연결됨 ✦', true);
      if (window.renderCalendar) window.renderCalendar();
      if (window.renderJobList)  window.renderJobList();
    }, () => setStatus('연결 오류', false));

    function setStatus(msg, ok) {
      const el = document.getElementById('connStatus');
      if (!el) return;
      el.textContent = msg;
      el.style.color = ok ? '#16a34a' : '#dc2626';
    }

    window._saveJobToDb = async (jobData) => {
      if (jobData._isEdit) {
        const { id, _isEdit, ...rest } = jobData;
        await set(ref(db, 'jobs/' + id), rest);
      } else {
        await push(jobsRef, jobData);
      }
    };
    window._deleteJobFromDb = async (id) => await remove(ref(db, 'jobs/' + id));
  </script>

  <style>
    :root {
      --bg:        #f5f4f0;
      --surface:   #ffffff;
      --surface2:  #f0ede8;
      --border:    #e2ddd8;
      --border2:   #ccc7c0;
      --text:      #1a1714;
      --text-dim:  #6b6560;
      --text-muted:#a09890;
      --radius:    14px;
      --radius-sm: 9px;

      --ua:        #4f6ef7;
      --ua-light:  #eef1fe;
      --ua-mid:    #c7d0fb;
      --ub:        #e0468a;
      --ub-light:  #fdeef5;
      --ub-mid:    #f9c0d8;

      --s0-bg: #f1f5f9; --s0-text: #64748b;
      --s1-bg: #fef9c3; --s1-text: #854d0e;
      --s2-bg: #e0f2fe; --s2-text: #0369a1;
      --s3-bg: #dcfce7; --s3-text: #15803d;
      --s4-bg: #d1fae5; --s4-text: #065f46;
      --s5-bg: #a7f3d0; --s5-text: #064e3b;
      --s6-bg: #fde68a; --s6-text: #92400e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 1px 4px #0000000a;
    }

    header h1 {
      font-family: 'Gowun Dodum', serif;
      font-size: 1.25rem;
      letter-spacing: 0.04em;
      color: var(--text);
    }

    #connStatus { font-size: 0.72rem; color: var(--text-muted); font-weight: 500; }

    .app {
      display: grid;
      grid-template-columns: 1fr 360px;
      flex: 1;
      overflow: hidden;
      height: calc(100vh - 61px);
    }

    .calendar-pane {
      padding: 24px 28px;
      overflow-y: auto;
      border-right: 1px solid var(--border);
    }

    .cal-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .cal-nav button {
      width: 34px; height: 34px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-dim);
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.15s;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 1px 3px #00000008;
    }
    .cal-nav button:hover { background: var(--surface2); border-color: var(--border2); }
    .cal-nav h2 { font-size: 1.1rem; font-weight: 700; color: var(--text); }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .cal-dow {
      text-align: center;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
      padding: 5px 0 9px;
      letter-spacing: 0.06em;
    }
    .cal-dow:first-child { color: #ef4444; }
    .cal-dow:last-child  { color: var(--ua); }

    .cal-day {
      min-height: 90px;
      border-radius: var(--radius-sm);
      border: 1.5px solid transparent;
      padding: 7px;
      cursor: pointer;
      transition: all 0.13s;
      background: var(--surface);
      box-shadow: 0 1px 2px #00000006;
    }
    .cal-day:hover    { border-color: var(--ua); background: var(--ua-light); }
    .cal-day.selected { border-color: var(--ua); background: var(--ua-light); box-shadow: 0 2px 8px #4f6ef718; }
    .cal-day.today .day-num {
      background: var(--ua); color: #fff; border-radius: 50%;
      width: 22px; height: 22px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700;
    }
    .cal-day.empty { background: transparent; border-color: transparent; cursor: default; box-shadow: none; }
    .cal-day.sun .day-num { color: #ef4444; }
    .cal-day.sat .day-num { color: var(--ua); }

    .day-num { font-size: 0.78rem; color: var(--text-dim); margin-bottom: 4px; font-weight: 500; }
    .day-chips { display: flex; flex-direction: column; gap: 2px; }

    .chip {
      font-size: 0.62rem; padding: 2px 5px; border-radius: 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 100%; font-weight: 500;
    }
    .chip-deadline { background: #fef9c3; color: #854d0e; border-left: 2px solid #f59e0b; }

    .sidebar {
      display: flex; flex-direction: column; overflow: hidden; background: var(--surface);
    }

    .sidebar-top {
      padding: 18px 18px 14px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-date-label {
      font-size: 1rem; font-weight: 700; color: var(--text);
    }

    .job-list {
      flex: 1; overflow-y: auto; padding: 12px;
      display: flex; flex-direction: column; gap: 8px;
    }

    .job-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 13px;
      cursor: pointer;
      transition: box-shadow 0.15s, border-color 0.15s;
      position: relative;
    }
    .job-card:hover { border-color: var(--border2); box-shadow: 0 3px 10px #00000010; }

    .job-card-company { font-weight: 700; font-size: 0.9rem; color: var(--text); margin-bottom: 3px; }
    .job-card-role    { font-size: 0.76rem; color: var(--text-dim); margin-bottom: 8px; }

    .job-card-meta { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }

    .tag {
      font-size: 0.63rem; padding: 2px 7px; border-radius: 20px;
      background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border);
    }
    .tag-field  { color: #0369a1; border-color: #bae6fd; background: #f0f9ff; }
    .tag-method { color: #7c3aed; border-color: #ddd6fe; background: #f5f3ff; }

    /* 방망졍이/수수링이 상태 행 */
    .status-row {
      display: flex; gap: 6px; align-items: center; margin-top: 2px;
    }
    .status-row-label {
      font-size: 0.7rem; font-weight: 700; color: var(--text-dim); min-width: 28px;
    }

    .status-badge {
      font-size: 0.67rem; font-weight: 700; padding: 2px 8px;
      border-radius: 20px; white-space: nowrap;
    }
    .s0 { background: var(--s0-bg); color: var(--s0-text); }
    .s1 { background: var(--s1-bg); color: var(--s1-text); }
    .s2 { background: var(--s2-bg); color: var(--s2-text); }
    .s3 { background: var(--s3-bg); color: var(--s3-text); }
    .s4 { background: var(--s4-bg); color: var(--s4-text); }
    .s5 { background: var(--s5-bg); color: var(--s5-text); }
    .s6 { background: var(--s6-bg); color: var(--s6-text); }

    .job-card-delete {
      position: absolute; top: 8px; right: 8px;
      width: 20px; height: 20px; border-radius: 50%;
      border: none; background: transparent; color: var(--text-muted);
      font-size: 0.8rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.13s, color 0.13s; opacity: 0;
    }
    .job-card:hover .job-card-delete { opacity: 1; }
    .job-card-delete:hover { background: #fee2e2; color: #dc2626; }

    .no-jobs {
      text-align: center; color: var(--text-muted); font-size: 0.82rem;
      padding: 40px 16px; line-height: 1.8;
    }

    .add-btn {
      margin: 10px 12px 12px; padding: 11px;
      border-radius: var(--radius-sm); border: 1.5px dashed var(--border2);
      background: transparent; color: var(--text-muted);
      font-family: 'Noto Sans KR', sans-serif; font-size: 0.82rem;
      cursor: pointer; transition: all 0.18s;
    }
    .add-btn:hover { border-color: var(--ua); color: var(--ua); background: var(--ua-light); }

    /* 모달 */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: #00000040; backdrop-filter: blur(3px);
      z-index: 100; align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 26px 28px;
      width: 460px; max-width: 95vw; max-height: 90vh; overflow-y: auto;
      box-shadow: 0 16px 48px #00000018; animation: pop 0.18s ease;
    }

    @keyframes pop {
      from { transform: scale(0.96); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }

    .modal-header {
      margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid var(--border);
    }
    .modal-header h3 { font-size: 1rem; font-weight: 700; color: var(--text); }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-group { margin-bottom: 13px; }

    label {
      display: block; font-size: 0.73rem; font-weight: 600;
      color: var(--text-dim); margin-bottom: 5px; letter-spacing: 0.04em;
    }

    input, select, textarea {
      width: 100%; background: var(--surface2); border: 1.5px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text);
      font-family: 'Noto Sans KR', sans-serif; font-size: 0.84rem;
      padding: 8px 11px; outline: none; transition: border-color 0.15s, background 0.15s;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--ua); background: var(--surface); }
    select option { background: var(--surface); }
    textarea { resize: vertical; min-height: 68px; }

    /* 상태 선택 */
    .status-section {
      border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      padding: 12px; margin-bottom: 13px; background: var(--surface2);
    }
    .status-section-title {
      font-size: 0.73rem; font-weight: 700; color: var(--text-dim);
      margin-bottom: 8px; letter-spacing: 0.04em;
    }
    .status-section-title span {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      margin-right: 5px; vertical-align: middle;
    }

    .status-selector {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
    }

    .status-opt {
      padding: 6px 3px; border-radius: 6px; border: 1.5px solid var(--border);
      background: var(--surface); font-family: 'Noto Sans KR', sans-serif;
      font-size: 0.67rem; font-weight: 600; cursor: pointer;
      text-align: center; transition: all 0.13s; color: var(--text-dim);
    }
    .status-opt:hover { border-color: var(--border2); }
    .status-opt.sel-0 { background: var(--s0-bg); color: var(--s0-text); border-color: #94a3b8; }
    .status-opt.sel-1 { background: var(--s1-bg); color: var(--s1-text); border-color: #f59e0b; }
    .status-opt.sel-2 { background: var(--s2-bg); color: var(--s2-text); border-color: #38bdf8; }
    .status-opt.sel-3 { background: var(--s3-bg); color: var(--s3-text); border-color: #4ade80; }
    .status-opt.sel-4 { background: var(--s4-bg); color: var(--s4-text); border-color: #34d399; }
    .status-opt.sel-5 { background: var(--s5-bg); color: var(--s5-text); border-color: #10b981; }
    .status-opt.sel-6 { background: var(--s6-bg); color: var(--s6-text); border-color: #f59e0b; }

    .modal-actions {
      display: flex; justify-content: flex-end; gap: 8px;
      margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border);
    }

    .btn-cancel {
      padding: 8px 18px; border-radius: var(--radius-sm);
      border: 1.5px solid var(--border); background: transparent; color: var(--text-dim);
      font-family: 'Noto Sans KR', sans-serif; font-size: 0.82rem; cursor: pointer;
      transition: background 0.13s;
    }
    .btn-cancel:hover { background: var(--surface2); }

    .btn-save {
      padding: 8px 22px; border-radius: var(--radius-sm); border: none;
      background: var(--ua); color: #fff;
      font-family: 'Noto Sans KR', sans-serif; font-size: 0.82rem; font-weight: 700;
      cursor: pointer; transition: opacity 0.13s; box-shadow: 0 2px 8px #4f6ef730;
    }
    .btn-save:hover { opacity: 0.85; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }
  </style>
</head>
<body>

<header>
  <h1>🍀취뽀가보자고🍀</h1>
  <span id="connStatus">연결 중...</span>
</header>

<div class="app">
  <!-- 달력 -->
  <div class="calendar-pane">
    <div class="cal-nav">
      <button onclick="changeMonth(-1)">&#8249;</button>
      <h2 id="monthLabel"></h2>
      <button onclick="changeMonth(1)">&#8250;</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <!-- 사이드바 -->
  <div class="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-date-label" id="selectedDateLabel">날짜를 선택하세요</div>
    </div>
    <div class="job-list" id="jobList">
      <div class="no-jobs">날짜를 선택하면<br>채용 정보가 표시돼요 ✦</div>
    </div>
    <button class="add-btn" id="addBtn" onclick="openModal()" style="display:none">
      ＋ 채용 정보 추가
    </button>
  </div>
</div>

<!-- 모달 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">채용 정보 등록</h3>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>회사 이름 *</label>
        <input type="text" id="fCompany" placeholder="예) 카카오" />
      </div>
      <div class="form-group">
        <label>직무</label>
        <input type="text" id="fRole" placeholder="예) AI 엔지니어" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>지원 방법</label>
        <select id="fMethod">
          <option value="">선택하세요</option>
          <option>회사 홈페이지</option>
          <option>사람인</option>
          <option>잡코리아</option>
          <option>링크드인</option>
          <option>원티드</option>
          <option>잡플래닛</option>
          <option>직접 이메일</option>
          <option>기타</option>
        </select>
      </div>
      <div class="form-group">
        <label>직무 분야</label>
        <select id="fField">
          <option value="">선택하세요</option>
          <option>AI / ML</option>
          <option>데이터 분석</option>
          <option>백엔드</option>
          <option>프론트엔드</option>
          <option>풀스택</option>
          <option>데이터 엔지니어링</option>
          <option>반도체 / 하드웨어</option>
          <option>기획 / PM</option>
          <option>UX / 디자인</option>
          <option>기타</option>
        </select>
      </div>
    </div>

    <!-- 방망졍이 상태 -->
    <div class="status-section">
      <div class="status-section-title">
        <span style="background:var(--ua)"></span>방망졍이 지원 상태
      </div>
      <div class="status-selector" id="statusSelectorA">
        <button class="status-opt" data-val="0" onclick="selectStatus('A',0)">지원 전</button>
        <button class="status-opt" data-val="1" onclick="selectStatus('A',1)">지원 중</button>
        <button class="status-opt" data-val="2" onclick="selectStatus('A',2)">지원 완료</button>
        <button class="status-opt" data-val="3" onclick="selectStatus('A',3)">서류 합격</button>
        <button class="status-opt" data-val="4" onclick="selectStatus('A',4)">1차 합격</button>
        <button class="status-opt" data-val="5" onclick="selectStatus('A',5)">2차 합격</button>
        <button class="status-opt" data-val="6" onclick="selectStatus('A',6)">최종 합격 🎉</button>
      </div>
    </div>

    <!-- 수수링이 상태 -->
    <div class="status-section">
      <div class="status-section-title">
        <span style="background:var(--ub)"></span>수수링이 지원 상태
      </div>
      <div class="status-selector" id="statusSelectorB">
        <button class="status-opt" data-val="0" onclick="selectStatus('B',0)">지원 전</button>
        <button class="status-opt" data-val="1" onclick="selectStatus('B',1)">지원 중</button>
        <button class="status-opt" data-val="2" onclick="selectStatus('B',2)">지원 완료</button>
        <button class="status-opt" data-val="3" onclick="selectStatus('B',3)">서류 합격</button>
        <button class="status-opt" data-val="4" onclick="selectStatus('B',4)">1차 합격</button>
        <button class="status-opt" data-val="5" onclick="selectStatus('B',5)">2차 합격</button>
        <button class="status-opt" data-val="6" onclick="selectStatus('B',6)">최종 합격 🎉</button>
      </div>
    </div>

    <div class="form-group">
      <label>기타 메모</label>
      <textarea id="fNote" placeholder="채용 URL, 우대사항, 메모 등..."></textarea>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn-save" onclick="saveJob()">저장</button>
    </div>
  </div>
</div>

<script>
  const STATUS_LABELS = ['지원 전','지원 중','지원 완료','서류 합격','1차 합격','2차 합격','최종 합격 🎉'];
  const STATUS_CLASS  = ['s0','s1','s2','s3','s4','s5','s6'];

  let currentYear, currentMonth;
  let selectedDate = null;
  window.jobs      = [];
  let editingId    = null;
  let selectedStatusA = 0;
  let selectedStatusB = 0;

  function init() {
    const now = new Date();
    currentYear  = now.getFullYear();
    currentMonth = now.getMonth();
    renderCalendar();
  }

  function changeMonth(delta) {
    currentMonth += delta;
    if (currentMonth > 11) { currentMonth = 0; currentYear++; }
    if (currentMonth < 0)  { currentMonth = 11; currentYear--; }
    renderCalendar();
  }

  function renderCalendar() {
    const jobs = window.jobs || [];
    const dows = ['일','월','화','수','목','금','토'];
    const monthNames = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
    document.getElementById('monthLabel').textContent = currentYear + '년 ' + monthNames[currentMonth];

    const grid = document.getElementById('calGrid');
    grid.innerHTML = '';

    dows.forEach(function(d) {
      const el = document.createElement('div');
      el.className = 'cal-dow';
      el.textContent = d;
      grid.appendChild(el);
    });

    const firstDay  = new Date(currentYear, currentMonth, 1).getDay();
    const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();
    const today     = new Date();

    for (let i = 0; i < firstDay; i++) {
      const el = document.createElement('div');
      el.className = 'cal-day empty';
      grid.appendChild(el);
    }

    for (let d = 1; d <= totalDays; d++) {
      const dateStr = currentYear + '-' +
        String(currentMonth+1).padStart(2,'0') + '-' +
        String(d).padStart(2,'0');
      const el  = document.createElement('div');
      const dow = (firstDay + d - 1) % 7;
      let cls   = 'cal-day';
      if (dow === 0) cls += ' sun';
      if (dow === 6) cls += ' sat';
      if (d === today.getDate() && currentMonth === today.getMonth() && currentYear === today.getFullYear()) cls += ' today';
      if (dateStr === selectedDate) cls += ' selected';
      el.className = cls;
      el.innerHTML = '<div class="day-num">' + d + '</div><div class="day-chips" id="chips-' + dateStr + '"></div>';
      el.onclick = (function(ds){ return function(){ selectDate(ds); }; })(dateStr);
      grid.appendChild(el);
    }

    // 마감일 기준으로 칩 표시
    jobs.forEach(function(j) {
      const el = document.getElementById('chips-' + j.date);
      if (!el) return;
      const chip = document.createElement('div');
      chip.className = 'chip chip-deadline';
      chip.textContent = j.company;
      el.appendChild(chip);
    });
  }

  function selectDate(dateStr) {
    selectedDate = dateStr;
    const p = dateStr.split('-');
    document.getElementById('selectedDateLabel').textContent =
      p[0] + '년 ' + parseInt(p[1]) + '월 ' + parseInt(p[2]) + '일 마감';
    document.getElementById('addBtn').style.display = 'block';
    renderJobList();
    renderCalendar();
  }

  function renderJobList() {
    if (!selectedDate) return;
    const jobs = window.jobs || [];
    const list = document.getElementById('jobList');
    const dayJobs = jobs.filter(function(j){ return j.date === selectedDate; });

    if (!dayJobs.length) {
      list.innerHTML = '<div class="no-jobs">이 날 마감인 공고가 없어요.<br>아래 버튼으로 추가해 보세요 ✦</div>';
      return;
    }

    list.innerHTML = '';
    dayJobs.forEach(function(j) {
      const stA = j.statusA !== undefined ? j.statusA : 0;
      const stB = j.statusB !== undefined ? j.statusB : 0;

      const card = document.createElement('div');
      card.className = 'job-card';
      card.innerHTML =
        '<div class="job-card-company">' + escHtml(j.company) + '</div>' +
        '<div class="job-card-role">' + escHtml(j.role || '직무 미입력') + '</div>' +
        '<div class="job-card-meta">' +
          (j.method ? '<span class="tag tag-method">' + escHtml(j.method) + '</span>' : '') +
          (j.field  ? '<span class="tag tag-field">'  + escHtml(j.field)  + '</span>' : '') +
        '</div>' +
        '<div class="status-row">' +
          '<span class="status-row-label" style="color:var(--ua)">방망졍이</span>' +
          '<span class="status-badge ' + STATUS_CLASS[stA] + '">' + STATUS_LABELS[stA] + '</span>' +
        '</div>' +
        '<div class="status-row" style="margin-top:4px">' +
          '<span class="status-row-label" style="color:var(--ub)">수수링이</span>' +
          '<span class="status-badge ' + STATUS_CLASS[stB] + '">' + STATUS_LABELS[stB] + '</span>' +
        '</div>' +
        (j.note ? '<div style="font-size:0.71rem;color:var(--text-muted);margin-top:7px;line-height:1.5">' + escHtml(j.note) + '</div>' : '') +
        '<button class="job-card-delete">✕</button>';

      card.querySelector('.job-card-delete').addEventListener('click', function(e){ deleteJob(j.id, e); });
      card.addEventListener('click', function(e){
        if (!e.target.classList.contains('job-card-delete')) openModal(j.id);
      });
      list.appendChild(card);
    });
  }

  function selectStatus(user, val) {
    if (user === 'A') selectedStatusA = val;
    else selectedStatusB = val;
    const sid = user === 'A' ? 'statusSelectorA' : 'statusSelectorB';
    document.querySelectorAll('#' + sid + ' .status-opt').forEach(function(btn) {
      const v = parseInt(btn.getAttribute('data-val'));
      btn.className = 'status-opt' + (v === val ? ' sel-' + val : '');
    });
  }

  function openModal(id) {
    id = id || null;
    editingId = id;
    const jobs = window.jobs || [];
    document.getElementById('modalTitle').textContent = id ? '채용 정보 수정' : '채용 정보 등록';

    if (id) {
      const j = jobs.find(function(x){ return x.id === id; });
      if (j) {
        document.getElementById('fCompany').value = j.company || '';
        document.getElementById('fMethod').value  = j.method  || '';
        document.getElementById('fRole').value    = j.role    || '';
        document.getElementById('fField').value   = j.field   || '';
        document.getElementById('fNote').value    = j.note    || '';
        selectStatus('A', j.statusA !== undefined ? j.statusA : 0);
        selectStatus('B', j.statusB !== undefined ? j.statusB : 0);
      }
    } else {
      ['fCompany','fRole','fNote'].forEach(function(fid){
        document.getElementById(fid).value = '';
      });
      document.getElementById('fMethod').value = '';
      document.getElementById('fField').value  = '';
      selectStatus('A', 0);
      selectStatus('B', 0);
    }

    document.getElementById('modalOverlay').classList.add('open');
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
    editingId = null;
  }

  function saveJob() {
    const company = document.getElementById('fCompany').value.trim();
    if (!company) { alert('회사 이름을 입력해 주세요.'); return; }
    if (!window._saveJobToDb) { alert('Firebase 연결 중입니다. 잠시 후 다시 시도해 주세요.'); return; }

    const data = {
      company:  company,
      method:   document.getElementById('fMethod').value,
      role:     document.getElementById('fRole').value.trim(),
      field:    document.getElementById('fField').value,
      note:     document.getElementById('fNote').value.trim(),
      statusA:  selectedStatusA,
      statusB:  selectedStatusB,
      date:     selectedDate,
    };

    const payload = editingId
      ? Object.assign({}, data, { id: editingId, _isEdit: true })
      : data;

    window._saveJobToDb(payload)
      .then(function(){ closeModal(); })
      .catch(function(e){ alert('저장 오류: ' + e.message); });
  }

  function deleteJob(id, e) {
    e.stopPropagation();
    if (!confirm('이 채용 정보를 삭제할까요?')) return;
    if (!window._deleteJobFromDb) return;
    window._deleteJobFromDb(id).catch(function(e){ alert('삭제 오류: ' + e.message); });
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  window.renderCalendar = renderCalendar;
  window.renderJobList  = renderJobList;

  document.getElementById('modalOverlay').addEventListener('click', function(e){
    if (e.target === this) closeModal();
  });

  init();
</script>
</body>
</html>
