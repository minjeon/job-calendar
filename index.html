<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🍀취뽀가보자고🍀</title>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, set, remove }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCi96DZbnjoUN0CZKFPPzzVMlqyQ33Hx9E",
      authDomain: "job-calendar-93c93.firebaseapp.com",
      databaseURL: "https://job-calendar-93c93-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "job-calendar-93c93",
      storageBucket: "job-calendar-93c93.firebasestorage.app",
      messagingSenderId: "256800524240",
      appId: "1:256800524240:web:20ab1d5a7909ca5797dbd5"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getDatabase(app);
    const jobsRef = ref(db, 'jobs');

    onValue(jobsRef, (snapshot) => {
      const data = snapshot.val();
      window.jobs = data ? Object.entries(data).map(([id, v]) => ({ id, ...v })) : [];
      setStatus('연결됨 ✦', true);
      if (window.renderCalendar) window.renderCalendar();
      if (window.renderJobList)  window.renderJobList();
      if (window.renderAnytimeList && anytimeOpen) window.renderAnytimeList();
    }, () => setStatus('연결 오류', false));

    function setStatus(msg, ok) {
      const el = document.getElementById('connStatus');
      if (!el) return;
      el.textContent = msg;
      el.style.color = ok ? '#6b8c6e' : '#c0392b';
    }

    window._saveJobToDb = async (jobData) => {
      if (jobData._isEdit) {
        const { id, _isEdit, ...rest } = jobData;
        await set(ref(db, 'jobs/' + id), rest);
      } else {
        await push(jobsRef, jobData);
      }
    };
    window._deleteJobFromDb = async (id) => await remove(ref(db, 'jobs/' + id));
  </script>

  <style>
    :root {
      --bg:         #f5f0e8;
      --surface:    #fdfaf5;
      --surface2:   #f0ebe0;
      --border:     #ddd5c5;
      --border2:    #c8bfae;
      --text:       #2c1a0e;
      --text-dim:   #6b4f38;
      --text-muted: #a08870;
      --accent:     #7a4f2e;
      --radius:     16px;
      --radius-sm:  10px;
      --sidebar-w:  380px;

      --ua:         #5c7a9e;
      --ua-light:   #eef3f8;
      --ub:         #9e5c7a;
      --ub-light:   #f8eef3;

      --s0-bg: #f0ede8; --s0-text: #7a6a58;
      --s1-bg: #fef5dc; --s1-text: #8a6a1e;
      --s2-bg: #deeef8; --s2-text: #2e6a9e;
      --s3-bg: #dcf0e0; --s3-text: #2e7a3e;
      --s4-bg: #c8e8cc; --s4-text: #1e6030;
      --s5-bg: #b0deb8; --s5-text: #145022;
      --s6-bg: #fce8b0; --s6-text: #7a4a10;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── 헤더 ── */
    header {
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 1px 4px #2c1a0e0a;
    }

    header h1 {
      font-family: 'Gowun Dodum', serif;
      font-size: 1.45rem;
      color: var(--accent);
      letter-spacing: 0.06em;
    }

    .header-right { display: flex; align-items: center; gap: 14px; }

    #connStatus { font-size: 0.72rem; color: var(--text-muted); }

    .toggle-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 14px; border-radius: 20px;
      border: 1px solid var(--border); background: var(--surface2);
      color: var(--text-dim); font-family: 'Noto Sans KR', sans-serif;
      font-size: 0.78rem; cursor: pointer; transition: all 0.18s;
    }
    .toggle-btn:hover { background: var(--border); color: var(--text); }
    .toggle-btn .arrow { font-size: 0.65rem; transition: transform 0.25s; display: inline-block; }
    .toggle-btn.closed .arrow { transform: rotate(180deg); }

    /* ── 레이아웃 ── */
    .app {
      display: flex; flex: 1;
      overflow: hidden;
      height: calc(100vh - 57px);
    }

    /* ── 달력 ── */
    .calendar-pane {
  flex: 1; padding: 20px 28px;
  overflow: hidden; transition: all 0.3s ease;
  display: flex; flex-direction: column;
}
    .cal-nav {
      display: flex; align-items: center; justify-content: center;
      gap: 28px; margin-bottom: 28px;
    }

    .cal-nav button {
      width: 30px; height: 30px; border-radius: 50%;
      border: 1px solid var(--border); background: transparent;
      color: var(--text-dim); font-size: 0.9rem; cursor: pointer;
      transition: all 0.15s; display: flex; align-items: center; justify-content: center;
    }
    .cal-nav button:hover { background: var(--border2); color: var(--text); }

    .cal-nav h2 {
      font-family: 'Gowun Dodum', serif;
      font-size: 1.15rem; color: var(--text);
      letter-spacing: 0.08em; min-width: 120px; text-align: center;
    }

    .cal-grid {
  display: grid; grid-template-columns: repeat(7, 1fr);
  grid-template-rows: auto repeat(6, minmax(120px, 1fr));
  gap: 1px; background: var(--border);
  border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden;
  flex: 1;
}

    .cal-dow {
      text-align: center; font-size: 0.68rem; font-weight: 600;
      color: var(--text-muted); padding: 10px 0;
      background: var(--surface2); letter-spacing: 0.1em;
    }
    .cal-dow:first-child { color: #b05050; }
    .cal-dow:last-child  { color: var(--ua); }

   .cal-day {
  padding: 8px 10px; cursor: pointer;
  transition: background 0.13s; background: var(--surface); position: relative;
}
    .cal-day:hover    { background: #f0ebe0; }
    .cal-day.selected { background: #e8e0d0; }
    .cal-day.today .day-num {
      background: var(--accent); color: #fff; border-radius: 50%;
      width: 24px; height: 24px;
      display: flex; align-items: center; justify-content: center; font-weight: 700;
    }
    .cal-day.empty  { background: transparent; cursor: default; }
    .cal-day.sun .day-num { color: #b05050; }
    .cal-day.sat .day-num { color: var(--ua); }

    .day-num { font-size: 0.78rem; color: var(--text-dim); margin-bottom: 5px; font-weight: 500; }
    .day-chips { display: flex; flex-direction: column; gap: 2px; }

    .chip {
      font-size: 0.72rem; padding: 3px 7px; border-radius: 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 100%; font-weight: 500;
      background: #ede8f8; color: #6b4fa8;
      border-left: 2px solid #9b7fe0;
    }

    /* ── 사이드바 ── */
    .sidebar {
      height: 100%; width: var(--sidebar-w); min-width: var(--sidebar-w);
      display: flex; flex-direction: column; overflow: hidden;
      background: var(--surface); border-left: 1px solid var(--border);
      transition: width 0.3s ease, min-width 0.3s ease, opacity 0.25s ease;
    }
    .sidebar.closed { width: 0; min-width: 0; opacity: 0; pointer-events: none; }

    .sidebar-top {
      padding: 20px 18px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .sidebar-date-label { font-size: 0.95rem; font-weight: 700; color: var(--text); margin-bottom: 2px; }
    .sidebar-date-sub   { font-size: 0.72rem; color: var(--text-muted); }

    .job-list {
      flex: 1; overflow-y: auto; padding: 12px;
      display: flex; flex-direction: column; gap: 8px;
    }

    /* 잡 카드 */
    .job-card {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 13px 14px;
      cursor: pointer; transition: box-shadow 0.15s, border-color 0.15s; position: relative;
    }
    .job-card:hover { border-color: var(--border2); box-shadow: 0 2px 8px #2c1a0e10; }

    .job-card-company { font-weight: 700; font-size: 0.9rem; color: var(--text); margin-bottom: 2px; }
    .job-card-role    { font-size: 0.75rem; color: var(--text-dim); margin-bottom: 7px; }

    .job-card-meta { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 9px; }

    .tag {
      font-size: 0.62rem; padding: 2px 7px; border-radius: 20px;
      background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border);
    }
    .tag-field  { color: #4a7a9e; border-color: #b8d4e8; background: #eef4f8; }
    .tag-method { color: #7a5a9e; border-color: #d4c8e8; background: #f4f0f8; }
    .tag-url {
      color: var(--accent); border-color: #c8a888; background: #f8f0e8;
      text-decoration: none; cursor: pointer;
    }
    .tag-url:hover { background: #f0e4d0; }

    .status-rows { display: flex; flex-direction: column; gap: 5px; }
    .status-row  { display: flex; align-items: center; gap: 8px; }
    .status-row-label { font-size: 0.68rem; font-weight: 700; min-width: 26px; }

    .status-badge {
      font-size: 0.65rem; font-weight: 600; padding: 2px 9px;
      border-radius: 20px; white-space: nowrap;
    }
    .s0 { background: var(--s0-bg); color: var(--s0-text); }
    .s1 { background: var(--s1-bg); color: var(--s1-text); }
    .s2 { background: var(--s2-bg); color: var(--s2-text); }
    .s3 { background: var(--s3-bg); color: var(--s3-text); }
    .s4 { background: var(--s4-bg); color: var(--s4-text); }
    .s5 { background: var(--s5-bg); color: var(--s5-text); }
    .s6 { background: var(--s6-bg); color: var(--s6-text); }

    .job-card-delete {
      position: absolute; top: 9px; right: 9px;
      width: 20px; height: 20px; border-radius: 50%;
      border: none; background: transparent; color: var(--text-muted);
      font-size: 0.75rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.13s, color 0.13s; opacity: 0;
    }
    .job-card:hover .job-card-delete { opacity: 1; }
    .job-card-delete:hover { background: #f0d8d8; color: #b03030; }

    .no-jobs {
      text-align: center; color: var(--text-muted); font-size: 0.82rem;
      padding: 40px 16px; line-height: 1.9;
    }

    .add-btn {
      margin: 10px 12px 14px; padding: 12px;
      border-radius: var(--radius-sm); border: 1.5px dashed var(--border2);
      background: transparent; color: var(--text-muted);
      font-family: 'Noto Sans KR', sans-serif; font-size: 0.82rem;
      cursor: pointer; transition: all 0.18s; flex-shrink: 0;
    }
    .add-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--surface2); }

    /* ── 모달 ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: #2c1a0e40; backdrop-filter: blur(3px);
      z-index: 100; align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 28px;
      width: 480px; max-width: 95vw; max-height: 90vh; overflow-y: auto;
      box-shadow: 0 20px 60px #2c1a0e20; animation: pop 0.18s ease;
    }

    @keyframes pop {
      from { transform: scale(0.96) translateY(8px); opacity: 0; }
      to   { transform: scale(1) translateY(0);      opacity: 1; }
    }

    .modal-header {
      margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid var(--border);
    }
    .modal-header h3 {
      font-family: 'Gowun Dodum', serif;
      font-size: 1.15rem; color: var(--accent);
    }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-group { margin-bottom: 13px; }

    label {
      display: block; font-size: 0.72rem; font-weight: 600;
      color: var(--text-dim); margin-bottom: 5px; letter-spacing: 0.05em;
    }

    input, select, textarea {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text);
      font-family: 'Noto Sans KR', sans-serif; font-size: 0.84rem;
      padding: 9px 12px; outline: none; transition: border-color 0.15s;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    select option { background: var(--surface); }
    textarea { resize: vertical; min-height: 68px; }

    .status-section {
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 12px 14px; margin-bottom: 13px; background: var(--bg);
    }
    .status-section-title {
      font-size: 0.72rem; font-weight: 700; color: var(--text-dim);
      margin-bottom: 9px; display: flex; align-items: center; gap: 6px;
    }
    .status-section-title .dot { width: 7px; height: 7px; border-radius: 50%; }

    .status-selector { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }

    .status-opt {
      padding: 7px 3px; border-radius: 7px; border: 1px solid var(--border);
      background: var(--surface); font-family: 'Noto Sans KR', sans-serif;
      font-size: 0.65rem; font-weight: 600; cursor: pointer;
      text-align: center; transition: all 0.12s; color: var(--text-dim);
    }
    .status-opt:hover { background: var(--surface2); }
    .status-opt.sel-0 { background: var(--s0-bg); color: var(--s0-text); border-color: #a09880; }
    .status-opt.sel-1 { background: var(--s1-bg); color: var(--s1-text); border-color: #c8a830; }
    .status-opt.sel-2 { background: var(--s2-bg); color: var(--s2-text); border-color: #5090c0; }
    .status-opt.sel-3 { background: var(--s3-bg); color: var(--s3-text); border-color: #50a060; }
    .status-opt.sel-4 { background: var(--s4-bg); color: var(--s4-text); border-color: #3a9050; }
    .status-opt.sel-5 { background: var(--s5-bg); color: var(--s5-text); border-color: #248040; }
    .status-opt.sel-6 { background: var(--s6-bg); color: var(--s6-text); border-color: #c0880a; }

    .modal-actions {
      display: flex; justify-content: flex-end; gap: 8px;
      margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border);
    }

    .btn-cancel {
      padding: 8px 18px; border-radius: var(--radius-sm);
      border: 1px solid var(--border); background: transparent; color: var(--text-dim);
      font-family: 'Noto Sans KR', sans-serif; font-size: 0.82rem; cursor: pointer;
      transition: background 0.13s;
    }
    .btn-cancel:hover { background: var(--surface2); }

    .btn-save {
      padding: 8px 22px; border-radius: var(--radius-sm); border: none;
      background: var(--accent); color: #fff;
      font-family: 'Noto Sans KR', sans-serif; font-size: 0.82rem; font-weight: 700;
      cursor: pointer; transition: opacity 0.13s;
    }
    .btn-save:hover { opacity: 0.85; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }
    
    .anytime-open { display: flex !important; }
  </style>
</head>
<body>

<header>
  <h1>🍀 취뽀가보자고 🍀</h1>
  <div class="header-right">
    <span id="connStatus">연결 중...</span>
    <button class="toggle-btn" onclick="toggleAnytime()">📌 수시채용</button>
    <button class="toggle-btn" id="toggleBtn" onclick="toggleSidebar()">
      목록 닫기 <span class="arrow">▶</span>
    </button>
  </div>
</header>

<div class="app">
  <div class="calendar-pane">
    <div class="cal-nav">
      <button onclick="changeMonth(-1)">&#8249;</button>
      <h2 id="monthLabel"></h2>
      <button onclick="changeMonth(1)">&#8250;</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <div class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-date-label" id="selectedDateLabel">날짜를 선택하세요</div>
      <div class="sidebar-date-sub" id="selectedDateSub">마감일 기준으로 공고가 표시돼요</div>
    </div>
    <div class="job-list" id="jobList">
      <div class="no-jobs">달력에서 날짜를 클릭하면<br>해당 마감일의 공고가 보여요 ✦</div>
    </div>
    <button class="add-btn" id="addBtn" onclick="openModal()" style="display:none">
      ＋ 채용 정보 추가
    </button>
  </div>
  <div class="sidebar" id="sidebarAnytime" style="display:none; width:var(--sidebar-w); min-width:var(--sidebar-w); height:100%; overflow:hidden;">
  <div class="sidebar-top">
    <div class="sidebar-date-label">📌 수시채용</div>
    <div class="sidebar-date-sub">마감일 없는 공고 모음</div>
  </div>
  <div class="job-list" id="jobListAnytime"></div>
  <button class="add-btn" onclick="openModalAnytime()">＋ 수시채용 추가</button>
</div>
</div>

<!-- 모달 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">채용 정보 등록</h3>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>회사 이름 *</label>
        <input type="text" id="fCompany" placeholder="예) 카카오" />
      </div>
      <div class="form-group">
        <label>직무</label>
        <input type="text" id="fRole" placeholder="예) AI 엔지니어" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>지원 방법</label>
        <select id="fMethod">
          <option value="">선택하세요</option>
          <option>회사 홈페이지</option>
          <option>사람인</option>
          <option>잡코리아</option>
          <option>링크드인</option>
          <option>원티드</option>
          <option>잡플래닛</option>
          <option>직접 이메일</option>
          <option>기타</option>
        </select>
      </div>
      <div class="form-group">
        <label>직무 분야</label>
        <select id="fField">
          <option value="">선택하세요</option>
          <option>AI / ML</option>
          <option>데이터 분석</option>
          <option>백엔드</option>
          <option>프론트엔드</option>
          <option>풀스택</option>
          <option>데이터 엔지니어링</option>
          <option>반도체 / 하드웨어</option>
          <option>기획 / PM</option>
          <option>UX / 디자인</option>
          <option>기타</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>지원 사이트 URL</label>
      <input type="url" id="fUrl" placeholder="https://www.saramin.co.kr/..." />
    </div>

    <div class="status-section">
      <div class="status-section-title">
        <span class="dot" style="background:var(--ua)"></span> 민정 지원 상태
      </div>
      <div class="status-selector" id="statusSelectorA">
        <button class="status-opt" data-val="0" onclick="selectStatus('A',0)">지원 전</button>
        <button class="status-opt" data-val="1" onclick="selectStatus('A',1)">지원 중</button>
        <button class="status-opt" data-val="2" onclick="selectStatus('A',2)">지원 완료</button>
        <button class="status-opt" data-val="3" onclick="selectStatus('A',3)">서류 합격</button>
        <button class="status-opt" data-val="4" onclick="selectStatus('A',4)">1차 합격</button>
        <button class="status-opt" data-val="5" onclick="selectStatus('A',5)">2차 합격</button>
        <button class="status-opt" data-val="6" onclick="selectStatus('A',6)">최종 합격 🎉</button>
      </div>
    </div>

    <div class="status-section">
      <div class="status-section-title">
        <span class="dot" style="background:var(--ub)"></span> 수인 지원 상태
      </div>
      <div class="status-selector" id="statusSelectorB">
        <button class="status-opt" data-val="0" onclick="selectStatus('B',0)">지원 전</button>
        <button class="status-opt" data-val="1" onclick="selectStatus('B',1)">지원 중</button>
        <button class="status-opt" data-val="2" onclick="selectStatus('B',2)">지원 완료</button>
        <button class="status-opt" data-val="3" onclick="selectStatus('B',3)">서류 합격</button>
        <button class="status-opt" data-val="4" onclick="selectStatus('B',4)">1차 합격</button>
        <button class="status-opt" data-val="5" onclick="selectStatus('B',5)">2차 합격</button>
        <button class="status-opt" data-val="6" onclick="selectStatus('B',6)">최종 합격 🎉</button>
      </div>
    </div>

    <div class="form-group">
      <label>기타 메모 (공고 PDF 링크 등)</label>
      <textarea id="fNote" placeholder="Drive/Notion 링크, 우대사항, 메모 등..."></textarea>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn-save" onclick="saveJob()">저장</button>
    </div>
  </div>
</div>

<script>
  const STATUS_LABELS = ['지원 전','지원 중','지원 완료','서류 합격','1차 합격','2차 합격','최종 합격 🎉'];
  const STATUS_CLASS  = ['s0','s1','s2','s3','s4','s5','s6'];

  let currentYear, currentMonth;
  let selectedDate    = null;
  window.jobs         = [];
  let editingId       = null;
  let isAnytime = false;
  let selectedStatusA = 0;
  let selectedStatusB = 0;
  let sidebarOpen     = true;

  function init() {
    const now = new Date();
    currentYear  = now.getFullYear();
    currentMonth = now.getMonth();
    renderCalendar();
  }

  function toggleSidebar() {
    sidebarOpen = !sidebarOpen;
    const sb  = document.getElementById('sidebar');
    const btn = document.getElementById('toggleBtn');
    if (sidebarOpen) {
      sb.classList.remove('closed');
      btn.innerHTML = '목록 닫기 <span class="arrow">▶</span>';
      btn.classList.remove('closed');
    } else {
      sb.classList.add('closed');
      btn.innerHTML = '목록 열기 <span class="arrow">▶</span>';
      btn.classList.add('closed');
    }
  }

  function changeMonth(delta) {
    currentMonth += delta;
    if (currentMonth > 11) { currentMonth = 0; currentYear++; }
    if (currentMonth < 0)  { currentMonth = 11; currentYear--; }
    renderCalendar();
  }

  function renderCalendar() {
    const jobs = window.jobs || [];
    const dows = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
    document.getElementById('monthLabel').textContent =
      currentYear + '.' + String(currentMonth + 1).padStart(2, '0');

    const grid = document.getElementById('calGrid');
    grid.innerHTML = '';

    dows.forEach(function(d) {
      const el = document.createElement('div');
      el.className = 'cal-dow';
      el.textContent = d;
      grid.appendChild(el);
    });

    const firstDay  = new Date(currentYear, currentMonth, 1).getDay();
    const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();
    const today     = new Date();

    for (let i = 0; i < firstDay; i++) {
      const el = document.createElement('div');
      el.className = 'cal-day empty';
      grid.appendChild(el);
    }

    for (let d = 1; d <= totalDays; d++) {
      const dateStr = currentYear + '-' +
        String(currentMonth + 1).padStart(2, '0') + '-' +
        String(d).padStart(2, '0');
      const el  = document.createElement('div');
      const dow = (firstDay + d - 1) % 7;
      let cls   = 'cal-day';
      if (dow === 0) cls += ' sun';
      if (dow === 6) cls += ' sat';
      if (d === today.getDate() && currentMonth === today.getMonth() && currentYear === today.getFullYear()) cls += ' today';
      if (dateStr === selectedDate) cls += ' selected';
      el.className = cls;
      el.innerHTML = '<div class="day-num">' + d + '</div><div class="day-chips" id="chips-' + dateStr + '"></div>';
      el.onclick = (function(ds) { return function() { selectDate(ds); }; })(dateStr);
      grid.appendChild(el);
    }

    jobs.forEach(function(j) {
      const el = document.getElementById('chips-' + j.date);
      if (!el) return;
      const chip = document.createElement('div');
      chip.className = 'chip';
      chip.textContent = j.company;
      el.appendChild(chip);
    });
  }

  function selectDate(dateStr) {
    selectedDate = dateStr;
    const p = dateStr.split('-');
    document.getElementById('selectedDateLabel').textContent =
      p[0] + '년 ' + parseInt(p[1]) + '월 ' + parseInt(p[2]) + '일';
    document.getElementById('selectedDateSub').textContent = '마감일 기준 공고';
    document.getElementById('addBtn').style.display = 'block';
    if (!sidebarOpen) toggleSidebar();
    renderJobList();
    renderCalendar();
  }

  function renderJobList() {
    if (!selectedDate) return;
    const jobs = window.jobs || [];
    const list = document.getElementById('jobList');
    const dayJobs = jobs.filter(function(j) { return j.date === selectedDate; });

    if (!dayJobs.length) {
      list.innerHTML = '<div class="no-jobs">이 날 마감인 공고가 없어요.<br>아래 버튼으로 추가해 보세요 ✦</div>';
      return;
    }

    list.innerHTML = '';
    dayJobs.forEach(function(j) {
      const stA = j.statusA !== undefined ? j.statusA : 0;
      const stB = j.statusB !== undefined ? j.statusB : 0;

      const urlTag = j.url
        ? '<a class="tag tag-url" href="' + escHtml(j.url) + '" target="_blank" onclick="event.stopPropagation()">🔗 공고 링크</a>'
        : '';

      const card = document.createElement('div');
      card.className = 'job-card';
      card.innerHTML =
        '<div class="job-card-company">' + escHtml(j.company) + '</div>' +
        '<div class="job-card-role">'    + escHtml(j.role || '직무 미입력') + '</div>' +
        '<div class="job-card-meta">' +
          (j.method ? '<span class="tag tag-method">' + escHtml(j.method) + '</span>' : '') +
          (j.field  ? '<span class="tag tag-field">'  + escHtml(j.field)  + '</span>' : '') +
          urlTag +
        '</div>' +
        '<div class="status-rows">' +
          '<div class="status-row">' +
            '<span class="status-row-label" style="color:var(--ua)">민정</span>' +
            '<span class="status-badge ' + STATUS_CLASS[stA] + '">' + STATUS_LABELS[stA] + '</span>' +
          '</div>' +
          '<div class="status-row">' +
            '<span class="status-row-label" style="color:var(--ub)">수인</span>' +
            '<span class="status-badge ' + STATUS_CLASS[stB] + '">' + STATUS_LABELS[stB] + '</span>' +
          '</div>' +
        '</div>' +
        (j.note ? '<div style="font-size:0.7rem;color:var(--text-muted);margin-top:8px;line-height:1.6">' + escHtml(j.note) + '</div>' : '') +
        '<button class="job-card-delete">✕</button>';

      card.querySelector('.job-card-delete').addEventListener('click', function(e) { deleteJob(j.id, e); });
      card.addEventListener('click', function(e) {
        if (!e.target.classList.contains('job-card-delete') && e.target.tagName !== 'A') openModal(j.id);
      });
      list.appendChild(card);
    });
  }

  function selectStatus(user, val) {
    if (user === 'A') selectedStatusA = val;
    else selectedStatusB = val;
    const sid = user === 'A' ? 'statusSelectorA' : 'statusSelectorB';
    document.querySelectorAll('#' + sid + ' .status-opt').forEach(function(btn) {
      const v = parseInt(btn.getAttribute('data-val'));
      btn.className = 'status-opt' + (v === val ? ' sel-' + val : '');
    });
  }

  function openModal(id) {
    id = id || null;
    editingId = id;
    const jobs = window.jobs || [];
    document.getElementById('modalTitle').textContent = id ? '채용 정보 수정' : '채용 정보 등록';

    if (id) {
      const j = jobs.find(function(x) { return x.id === id; });
      if (j) {
        document.getElementById('fCompany').value = j.company || '';
        document.getElementById('fMethod').value  = j.method  || '';
        document.getElementById('fRole').value    = j.role    || '';
        document.getElementById('fField').value   = j.field   || '';
        document.getElementById('fUrl').value     = j.url     || '';
        document.getElementById('fNote').value    = j.note    || '';
        selectStatus('A', j.statusA !== undefined ? j.statusA : 0);
        selectStatus('B', j.statusB !== undefined ? j.statusB : 0);
      }
    } else {
      ['fCompany','fRole','fUrl','fNote'].forEach(function(fid) {
        document.getElementById(fid).value = '';
      });
      document.getElementById('fMethod').value = '';
      document.getElementById('fField').value  = '';
      selectStatus('A', 0);
      selectStatus('B', 0);
    }

    document.getElementById('modalOverlay').classList.add('open');
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
    editingId = null;
    isAnytime = false;
  }

  function saveJob() {
    const company = document.getElementById('fCompany').value.trim();
    if (!company) { alert('회사 이름을 입력해 주세요.'); return; }
    if (!window._saveJobToDb) { alert('Firebase 연결 중입니다. 잠시 후 다시 시도해 주세요.'); return; }

    const data = {
      company:  company,
      method:   document.getElementById('fMethod').value,
      role:     document.getElementById('fRole').value.trim(),
      field:    document.getElementById('fField').value,
      url:      document.getElementById('fUrl').value.trim(),
      note:     document.getElementById('fNote').value.trim(),
      statusA:  selectedStatusA,
      statusB:  selectedStatusB,
      date: isAnytime ? 'anytime' : selectedDate,
    };

    const payload = editingId
      ? Object.assign({}, data, { id: editingId, _isEdit: true })
      : data;

    window._saveJobToDb(payload)
      .then(function() { closeModal(); })
      .catch(function(e) { alert('저장 오류: ' + e.message); });
  }

  function deleteJob(id, e) {
    e.stopPropagation();
    if (!confirm('이 채용 정보를 삭제할까요?')) return;
    if (!window._deleteJobFromDb) return;
    window._deleteJobFromDb(id).catch(function(e) { alert('삭제 오류: ' + e.message); });
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  let anytimeOpen = false;

function toggleAnytime() {
  anytimeOpen = !anytimeOpen;
  const sbNormal   = document.getElementById('sidebar');
  const sbAnytime  = document.getElementById('sidebarAnytime');

  if (anytimeOpen) {
    sbNormal.classList.add('closed');
    sbAnytime.style.display = 'flex';
    sbAnytime.style.flexDirection = 'column';
    renderAnytimeList();
  } else {
    sbAnytime.style.display = 'none';
    // 원래 사이드바 복구 (목록 열기 상태였으면 다시 열기)
    sbNormal.classList.remove('closed');
    sidebarOpen = true;
    document.getElementById('toggleBtn').innerHTML = '목록 닫기 <span class="arrow">▶</span>';
    document.getElementById('toggleBtn').classList.remove('closed');
  }
}

function openModalAnytime() {
  editingId = null;
  isAnytime = true;
  document.getElementById('modalTitle').textContent = '수시채용 등록';
  ['fCompany','fRole','fUrl','fNote'].forEach(function(fid) {
    document.getElementById(fid).value = '';
  });
  document.getElementById('fMethod').value = '';
  document.getElementById('fField').value  = '';
  selectStatus('A', 0);
  selectStatus('B', 0);
  document.getElementById('modalOverlay').classList.add('open');
}

function renderAnytimeList() {
  const jobs = window.jobs || [];
  const list = document.getElementById('jobListAnytime');
  const anytimeJobs = jobs.filter(function(j) { return j.date === 'anytime'; });

  if (!anytimeJobs.length) {
    list.innerHTML = '<div class="no-jobs">수시채용 공고가 없어요.<br>아래 버튼으로 추가해 보세요 ✦</div>';
    return;
  }

  list.innerHTML = '';
  anytimeJobs.forEach(function(j) {
    const stA = j.statusA !== undefined ? j.statusA : 0;
    const stB = j.statusB !== undefined ? j.statusB : 0;
    const urlTag = j.url
      ? '<a class="tag tag-url" href="' + escHtml(j.url) + '" target="_blank" onclick="event.stopPropagation()">🔗 공고 링크</a>'
      : '';

    const card = document.createElement('div');
    card.className = 'job-card';
    card.innerHTML =
      '<div class="job-card-company">' + escHtml(j.company) + '</div>' +
      '<div class="job-card-role">'    + escHtml(j.role || '직무 미입력') + '</div>' +
      '<div class="job-card-meta">' +
        (j.method ? '<span class="tag tag-method">' + escHtml(j.method) + '</span>' : '') +
        (j.field  ? '<span class="tag tag-field">'  + escHtml(j.field)  + '</span>' : '') +
        urlTag +
      '</div>' +
      '<div class="status-rows">' +
        '<div class="status-row"><span class="status-row-label" style="color:var(--ua)">민정</span><span class="status-badge ' + STATUS_CLASS[stA] + '">' + STATUS_LABELS[stA] + '</span></div>' +
        '<div class="status-row"><span class="status-row-label" style="color:var(--ub)">수인</span><span class="status-badge ' + STATUS_CLASS[stB] + '">' + STATUS_LABELS[stB] + '</span></div>' +
      '</div>' +
      (j.note ? '<div style="font-size:0.7rem;color:var(--text-muted);margin-top:8px;line-height:1.6">' + escHtml(j.note) + '</div>' : '') +
      '<button class="job-card-delete">✕</button>';

    card.querySelector('.job-card-delete').addEventListener('click', function(e) { deleteJob(j.id, e); });
    card.addEventListener('click', function(e) {
      if (!e.target.classList.contains('job-card-delete') && e.target.tagName !== 'A') {
        isAnytime = true;
        openModal(j.id);
      }
    });
    list.appendChild(card);
  });
}

  window.renderCalendar = renderCalendar;
  window.renderJobList  = renderJobList;
  window.renderAnytimeList = renderAnytimeList;

  document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  init();
</script>
</body>
</html>
